spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_service_db
    username: auth_user
    password: auth_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 10
        order_inserts: true
        order_updates: true

server:
  port: 8080

jwt:
  secret: dev-secret-key-change-in-production-this-must-be-at-least-32-chars
  access-token-expiration: 900000
  refresh-token-expiration: 2592000000

logging:
  level:
    root: INFO
    com.authservice: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.springframework.boot.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
