spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_service_test
    username: auth_user
    password: auth_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false

server:
  port: 8080

jwt:
  secret: test-secret-key-change-in-production-this-must-be-at-least-32-chars
  access-token-expiration: 900000
  refresh-token-expiration: 2592000000

logging:
  level:
    root: WARN
    com.authservice: INFO
    org.testcontainers: WARN
